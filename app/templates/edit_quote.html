{% extends 'base2.html' %}
{% block title %}Edit Quote{% endblock %}

{% block content %}
<h1>Edit Quote #{{ quote.quote_number }}</h1>
<br>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <h2>Line Items</h2>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>Description</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Total Price</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody>
            {% for item in line_items %}
                <tr>
                    <td>
                        <input type="text" name="description" value="{{ item.description }}">
                        <input type="hidden" name="line_item_id" value="{{ item.id }}">
                    </td>
                    <td><input type="number" step="1" name="quantity" value="{{ item.quantity }}"></td>
                    <td><input type="number" step="0.01" name="unit_price" value="{{ item.unit_price }}"></td>
                    <td><input type="text" name="total_price" value="{{ item.total_price }}" readonly></td>
                    <td><input type="checkbox" name="delete_item" value="{{ item.id }}"></td>
                </tr>
            {% endfor %}
            <!-- Always include one empty row for new entries -->
            <tr>
                <td>
                    <input type="text" name="description">
                    <input type="hidden" name="line_item_id" value="">
                </td>
                <td><input type="number" step="1" name="quantity"></td>
                <td><input type="number" step="0.01" name="unit_price"></td>
                <td><input type="text" name="total_price" readonly></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <br>
    <button type="submit">Save Changes</button>
</form>
{% endblock %}
