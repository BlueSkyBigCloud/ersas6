{% extends 'base2.html' %}

{% block title %}Assign Employee to Service Request{% endblock %}

{% block content %}
<h1>Assign Employee to Service Request</h1>

<form action="" method="post">
    {% csrf_token %}
    <label for="employee">Select an employee:</label>
    <select id="employee" name="employee">
        {% for employee in employees %}
        <option value="{{ employee.id }}">{{ employee.first_name }} {{ employee.last_name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="button">Assign Employee</button>
</form>
{% endblock %}
