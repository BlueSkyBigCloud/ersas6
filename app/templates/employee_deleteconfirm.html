{% extends "base2.html" %}

{% block title %}Delete Employee{% endblock %}

{% block content %}
<h2>Are you sure you want to delete {{ object.first_name }} {{ object.last_name }}?</h2>

<form method="post">
    {% csrf_token %}
    <button type="submit" style="background-color: rgb(69, 5, 5); color: white;">Yes, Delete</button>
    <a href="{% url 'employee_list' %}">Cancel</a>
</form>
{% endblock %}
