{% extends 'base.html' %}
{% load static %}
{% block title %}Custom Checkout - TRADE SEC 2.0{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<body>
    <h2 style="text-align: center;">Custom Checkout</h2>
    <p style="text-align: center;">Enter an invoice number and amount to pay.</p>

    <div style="display: flex; justify-content: center; margin-top: 40px;">
        <div class="store-item" 
             style="border: 1px solid #ccc; padding: 20px; width: 300px; text-align: center; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            
            <h3>Invoice Payment</h3>
            <p>Enter your invoice number and payment amount below.</p>
            <br>

            <form method="post">
                {% csrf_token %}
                
                <input type="text" name="invoice_number" placeholder="Invoice Number" required 
                       style="padding: 8px; width: 100%; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

                <input type="number" name="custom_amount" step="0.01" min="0.50" placeholder="Enter amount (USD)" required 
                       style="padding: 8px; width: 100%; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

                <button type="submit" 
                        style="padding: 10px 20px; border: none; border-radius: 6px; background-color: #007bff; color: #fff; font-size: 16px; cursor: pointer;">
                    Pay Now
                </button>
            </form>
        </div>
    </div>
</body>
{% endblock %}
