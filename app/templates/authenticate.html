{% extends 'base2.html' %}

{% load static %}

{% block title %}Check your Authenticator{% endblock %}

{% block content %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticate</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>To keep your account secure, we verify your identity.</h2>
        <p>Enter the code generated by your authenticator app.</p>
        <label for="account">Account</label>
        <input type="text" id="account" name="account" placeholder="Enter your account">
        
        <label for="verification-code">Verification Code</label>
        <input type="text" id="verification-code" name="verification-code" placeholder="Enter code">
        
        <button type="submit">Verify</button>
    </div>
</body>

{% endblock %}
