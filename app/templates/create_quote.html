{% extends 'base2.html' %}
{% load static %}
{% block title %}Create Quote{% endblock %}

{% block content %}
<head>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        a {
            text-decoration: none;
            color: blue;
        }
        a:hover {
            text-decoration: underline;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .add-customer {
            margin: 20px 0;
            text-align: right;
        }
        .add-customer a {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
        .add-customer a:hover {
            background-color: #45a049;
        }
    </style>
</head>
<main>
    <h2>Create New Quote</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <br><br>

        <button type="submit" class="button">Create Quote</button>
    </form>

    <br>
    <a href="{% url 'quote_list' %}" class="button">Back to Quotes</a>
</main>
{% endblock %}
