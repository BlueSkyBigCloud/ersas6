{% extends 'base.html' %}
{% load static %}
{% block title %}TradeSec{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        /* Set a fixed height for the slideshow */
        .carousel-inner {
            max-height: 600px; /* Adjust height as needed */
        }

        .carousel-item img {
            object-fit: contain; /* Scale image without cropping */
            height: 500px; /* Match max-height for consistency */
            background-color: #000; /* Optional: adds a black background */
        }
    </style>

</head>
<body>

    
<div class="container mt-4">
    <div id="slideshow" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="{% static 'images/slideshow/PROFOROPS_LOGO.jpg' %}" class="d-block w-100 rounded" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="{% static 'images/slideshow/web_image2.jpg' %}" class="d-block w-100 rounded" alt="Slide 2">
            </div>
            <div class="carousel-item">
                <img src="{% static 'images/slideshow/web_image3.jpg' %}" class="d-block w-100 rounded" alt="Slide 3">
            </div>
            <div class="carousel-item">
                <img src="{% static 'images/slideshow/web_image4.jpg' %}" class="d-block w-100 rounded" alt="Slide 4">
            </div>
            <div class="carousel-item">
                <img src="{% static 'images/slideshow/web_image5.jpg' %}" class="d-block w-100 rounded" alt="Slide 5">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#slideshow" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#slideshow" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    var myCarousel = new bootstrap.Carousel(document.querySelector('#slideshow'), {
        interval: 5000, // 6 seconds per slide
        ride: 'carousel'
    });
</script>

</body>
<br>
<br>

<div class="centered-div">
    <h1><a href="{% url 'signup' %}" class="signup-button">Start Now</a></h1>
</div>
<br>
<br>
</html>

{% endblock %}
