{% extends "base2.html" %}

{% block content %}
<div class="container text-center">
    <h2>Complete Your Payment</h2>

    {% if error %}
        <p class="text-danger">{{ error }}</p>
    {% endif %}

    <div class="mt-4">
        <form method="post" action="{% url 'make_payment' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary btn-lg">Subscribe Now</button>
        </form>
    </div>

    <div class="mt-4">
        <a href="{% url 'account_billing' %}" class="btn btn-secondary">Back to Billing</a>
    </div>
</div>
{% endblock %}
