{% extends 'base2.html' %}

{% block title %}Employee List{% endblock %}

{% block content %}

<br>
<br>

<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
</head>


<!-- ============================================================
     Service Navigation
     ============================================================ -->

<div center class="service-actions-container"
     style="display: flex; justify-content: center; gap: 10px;">

    <div class="service-actions">
        <a class="button-calendar-btn"
           href="{% url 'location_list' %}">
            Locations
        </a>
    </div>

    <div class="service-actions">
        <a class="button-calendar-btn"
           href="{% url 'equipment_list' %}">
            Equipment
        </a>
    </div>

    <div class="service-actions">
        <a class="button-calendar-btn"
           href="{% url 'employee_list' %}">
            Employees
        </a>
    </div>

    <div class="service-actions">
        <a class="button-calendar-btn"
           href="{% url 'servicetype_list' %}">
            Service Types
        </a>
    </div>

    <div class="service-actions">
        <a class="button-calendar-btn"
           href="{% url 'calendar_view' %}">
            Calendar
        </a>
    </div>

</div>


<body>

    <!-- ========================================================
         Page Header
         ======================================================== -->

    <h1>Employees</h1>


    <!-- ========================================================
         Add Employee
         ======================================================== -->

    <div class="model-actions">

        <a class="button add-model-btn"
           href="{% url 'employee_create' %}">
            Add New Employee
        </a>

    </div>


    <!-- ========================================================
         Search / Sort
         ======================================================== -->

    <div class="model-actions">

        <input
            type="text"
            id="employeeSearch"
            name="search"
            placeholder="Search employee number, first name, last name, or callsign"
            value="{{ search }}"
        >

        <select id="employeeSort" name="sort">

            <option value="-id"
                {% if sort == "-id" %}selected{% endif %}>
                Employee ID — Newest
            </option>

            <option value="id"
                {% if sort == "id" %}selected{% endif %}>
                Employee ID — Oldest
            </option>

            <option value="employee_number"
                {% if sort == "employee_number" %}selected{% endif %}>
                Employee Number — A-Z
            </option>

            <option value="-employee_number"
                {% if sort == "-employee_number" %}selected{% endif %}>
                Employee Number — Z-A
            </option>

            <option value="first_name"
                {% if sort == "first_name" %}selected{% endif %}>
                First Name — A-Z
            </option>

            <option value="-first_name"
                {% if sort == "-first_name" %}selected{% endif %}>
                First Name — Z-A
            </option>

            <option value="last_name"
                {% if sort == "last_name" %}selected{% endif %}>
                Last Name — A-Z
            </option>

            <option value="-last_name"
                {% if sort == "-last_name" %}selected{% endif %}>
                Last Name — Z-A
            </option>

            <option value="callsign"
                {% if sort == "callsign" %}selected{% endif %}>
                Callsign — A-Z
            </option>

            <option value="-callsign"
                {% if sort == "-callsign" %}selected{% endif %}>
                Callsign — Z-A
            </option>

        </select>

        <button
            type="button"
            id="employeeSearchButton"
            class="button"
        >
            Search / Sort
        </button>

        <button
            type="button"
            id="employeeClearButton"
            class="button"
        >
            Clear
        </button>

    </div>


    <br>


    <!-- ========================================================
         Employee Results
         ======================================================== -->

    <div id="employeeResults">

        {% include 'partials/employee_table.html' %}

    </div>


</body>


<!-- ================================================================
     AJAX Search / Sort / Pagination
     ================================================================ -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const searchInput =
        document.getElementById("employeeSearch");

    const sortSelect =
        document.getElementById("employeeSort");

    const searchButton =
        document.getElementById("employeeSearchButton");

    const clearButton =
        document.getElementById("employeeClearButton");

    const resultsContainer =
        document.getElementById("employeeResults");


    let searchTimeout = null;


    // ============================================================
    // Update Employee Results
    // ============================================================

    function updateEmployees(page = 1) {

        const search =
            searchInput.value.trim();

        const sort =
            sortSelect.value;


        const params =
            new URLSearchParams();

        params.set("search", search);
        params.set("sort", sort);
        params.set("page", page);


        resultsContainer.style.opacity = "0.5";


        fetch(
            `${window.location.pathname}?${params.toString()}`,
            {
                method: "GET",

                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            }
        )
        .then(response => {

            if (!response.ok) {

                throw new Error(
                    `HTTP error: ${response.status}`
                );

            }

            return response.json();

        })
        .then(data => {

            resultsContainer.innerHTML =
                data.html;

            resultsContainer.style.opacity = "1";


            // Keep search/sort/page in browser URL
            // without reloading the page.

            window.history.replaceState(
                {},
                "",
                `${window.location.pathname}?${params.toString()}`
            );

        })
        .catch(error => {

            console.error(
                "Employee AJAX error:",
                error
            );

            resultsContainer.style.opacity = "1";

        });

    }


    // ============================================================
    // Search Button
    // ============================================================

    searchButton.addEventListener(
        "click",
        function () {

            updateEmployees(1);

        }
    );


    // ============================================================
    // Sort
    // ============================================================

    sortSelect.addEventListener(
        "change",
        function () {

            // Always return to page 1
            // when sorting changes.

            updateEmployees(1);

        }
    );


    // ============================================================
    // Live Search
    //
    // Wait 300ms after the user stops typing.
    // ============================================================

    searchInput.addEventListener(
        "input",
        function () {

            clearTimeout(searchTimeout);

            searchTimeout = setTimeout(
                function () {

                    updateEmployees(1);

                },
                300
            );

        }
    );


    // ============================================================
    // Clear
    // ============================================================

    clearButton.addEventListener(
        "click",
        function () {

            searchInput.value = "";

            sortSelect.value = "-id";

            updateEmployees(1);

        }
    );


    // ============================================================
    // AJAX Pagination
    //
    // Pagination links are generated inside
    // employee_table.html.
    //
    // Event delegation is required because the
    // table/pagination HTML is replaced by AJAX.
    // ============================================================

    resultsContainer.addEventListener(
        "click",
        function (event) {

            const link =
                event.target.closest(
                    ".employee-page-link"
                );


            if (!link) {

                return;

            }


            event.preventDefault();


            const page =
                link.dataset.page;


            if (!page) {

                return;

            }


            updateEmployees(page);

        }
    );

});

</script>

{% endblock %}
