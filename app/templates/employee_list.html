
{% extends "base2.html" %}

{% block content %}

<div class="container-fluid">

    <!-- ============================================================
         Service Navigation
         ============================================================ -->

    <div
        class="service-actions-container"
        style="
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        "
    >

        <div class="service-actions">
            <a
                class="button-calendar-btn"
                href="{% url 'location_list' %}"
            >
                Locations
            </a>
        </div>

        <div class="service-actions">
            <a
                class="button-calendar-btn"
                href="{% url 'equipment_list' %}"
            >
                Equipment
            </a>
        </div>

        <div class="service-actions">
            <a
                class="button-calendar-btn"
                href="{% url 'employee_list' %}"
            >
                Employees
            </a>
        </div>

        <div class="service-actions">
            <a
                class="button-calendar-btn"
                href="{% url 'servicetype_list' %}"
            >
                Service Types
            </a>
        </div>

        <div class="service-actions">
            <a
                class="button-calendar-btn"
                href="{% url 'calendar_view' %}"
            >
                Calendar
            </a>
        </div>

    </div>


    <!-- ============================================================
         Page Header
         ============================================================ -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>Employees</h2>

            <p class="text-muted mb-0">
                Manage employees for your company.
            </p>

        </div>

    </div>


    <!-- ============================================================
         Search and Sort
         ============================================================ -->

    <form
        id="employeeSearchForm"
        method="get"
        class="mb-4"
        onsubmit="return false;"
    >

        <div class="row g-3 align-items-end">

            <!-- Search -->

            <div class="col-md-6">

                <label
                    for="search"
                    class="form-label"
                >
                    Search Employees
                </label>

                <input
                    type="text"
                    id="search"
                    name="search"
                    class="form-control"
                    placeholder="Employee number, first name, last name, or callsign"
                    value="{{ search }}"
                    autocomplete="off"
                >

            </div>


            <!-- Sort -->

            <div class="col-md-4">

                <label
                    for="sort"
                    class="form-label"
                >
                    Sort By
                </label>

                <select
                    id="sort"
                    name="sort"
                    class="form-select"
                >

                    <option
                        value="-id"
                        {% if sort == "-id" %}selected{% endif %}
                    >
                        Employee ID — Newest
                    </option>

                    <option
                        value="id"
                        {% if sort == "id" %}selected{% endif %}
                    >
                        Employee ID — Oldest
                    </option>

                    <option
                        value="employee_number"
                        {% if sort == "employee_number" %}selected{% endif %}
                    >
                        Employee Number — A-Z
                    </option>

                    <option
                        value="-employee_number"
                        {% if sort == "-employee_number" %}selected{% endif %}
                    >
                        Employee Number — Z-A
                    </option>

                    <option
                        value="first_name"
                        {% if sort == "first_name" %}selected{% endif %}
                    >
                        First Name — A-Z
                    </option>

                    <option
                        value="-first_name"
                        {% if sort == "-first_name" %}selected{% endif %}
                    >
                        First Name — Z-A
                    </option>

                    <option
                        value="last_name"
                        {% if sort == "last_name" %}selected{% endif %}
                    >
                        Last Name — A-Z
                    </option>

                    <option
                        value="-last_name"
                        {% if sort == "-last_name" %}selected{% endif %}
                    >
                        Last Name — Z-A
                    </option>

                    <option
                        value="callsign"
                        {% if sort == "callsign" %}selected{% endif %}
                    >
                        Callsign — A-Z
                    </option>

                    <option
                        value="-callsign"
                        {% if sort == "-callsign" %}selected{% endif %}
                    >
                        Callsign — Z-A
                    </option>

                </select>

            </div>


            <!-- Buttons -->

            <div class="col-md-2">

                <button
                    type="button"
                    id="employeeSearchButton"
                    class="btn btn-primary w-100 mb-2"
                >
                    Search / Sort
                </button>

                <button
                    type="button"
                    id="employeeClearButton"
                    class="btn btn-secondary w-100"
                >
                    Clear
                </button>

            </div>

        </div>

    </form>


    <!-- ============================================================
         AJAX Employee Results
         ============================================================ -->

    <div id="employeeResults">

        {% include 'partials/employee_table.html' %}

    </div>

</div>


<!-- ================================================================
     AJAX Employee Search / Sort / Pagination
     ================================================================ -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const searchInput =
        document.getElementById("search");

    const sortSelect =
        document.getElementById("sort");

    const searchButton =
        document.getElementById("employeeSearchButton");

    const clearButton =
        document.getElementById("employeeClearButton");

    const resultsContainer =
        document.getElementById("employeeResults");


    let searchTimeout = null;


    // ============================================================
    // Update Employee Results
    // ============================================================

    function updateEmployees(page = 1) {

        const search =
            searchInput.value.trim();

        const sort =
            sortSelect.value;

        const params =
            new URLSearchParams();

        params.set("search", search);
        params.set("sort", sort);
        params.set("page", page);


        resultsContainer.style.opacity = "0.5";


        fetch(
            `${window.location.pathname}?${params.toString()}`,
            {
                method: "GET",

                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            }
        )
        .then(response => {

            if (!response.ok) {
                throw new Error(
                    `HTTP error: ${response.status}`
                );
            }

            return response.json();

        })
        .then(data => {

            resultsContainer.innerHTML =
                data.html;

            resultsContainer.style.opacity = "1";


            // Update browser URL without
            // causing a page reload.

            const newUrl =
                `${window.location.pathname}?${params.toString()}`;

            window.history.replaceState(
                {},
                "",
                newUrl
            );

        })
        .catch(error => {

            console.error(
                "Employee AJAX error:",
                error
            );

            resultsContainer.style.opacity = "1";

        });

    }


    // ============================================================
    // Search Button
    // ============================================================

    searchButton.addEventListener(
        "click",
        function () {

            updateEmployees(1);

        }
    );


    // ============================================================
    // Sort Change
    // ============================================================

    sortSelect.addEventListener(
        "change",
        function () {

            // Sorting starts at page 1.

            updateEmployees(1);

        }
    );


    // ============================================================
    // Search Input
    //
    // Automatically search after the user stops typing.
    // 300ms debounce prevents a request for every keystroke.
    // ============================================================

    searchInput.addEventListener(
        "input",
        function () {

            clearTimeout(searchTimeout);

            searchTimeout = setTimeout(
                function () {

                    updateEmployees(1);

                },
                300
            );

        }
    );


    // ============================================================
    // Clear
    // ============================================================

    clearButton.addEventListener(
        "click",
        function () {

            searchInput.value = "";

            sortSelect.value = "-id";

            updateEmployees(1);

        }
    );


    // ============================================================
    // Pagination
    //
    // employee_table.html creates links with the class:
    //
    //     employee-page-link
    //
    // Event delegation allows the links to continue working
    // after the results HTML is replaced by AJAX.
    // ============================================================

    resultsContainer.addEventListener(
        "click",
        function (event) {

            const link =
                event.target.closest(
                    ".employee-page-link"
                );

            if (!link) {
                return;
            }


            event.preventDefault();


            const page =
                link.dataset.page;


            if (!page) {
                return;
            }


            updateEmployees(page);

        }
    );

});

</script>

{% endblock %}
