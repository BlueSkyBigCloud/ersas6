{% extends 'base2.html' %}

{% block title %}Edit Invoice{% endblock %}

{% block content %}
<h1>Edit Invoice</h1>
<br>

<form method="POST">
    {% csrf_token %}
    
    {{ form.as_p }}

    <h2>Line Items</h2>
    <table>
        <thead>
            <tr>
                <th>Description</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Total Price</th>
            </tr>
        </thead>
        <tbody>
            {% for item in line_items %}
                <tr>
                    <td><input type="text" name="description" value="{{ item.description }}"></td>
                    <td><input type="number" name="quantity" value="{{ item.quantity }}"></td>
                    <td><input type="number" name="unit_price" value="{{ item.unit_price }}"></td>
                    <td><input type="text" name="total_price" value="{{ item.total_price }}" readonly></td>
                    <td><input type="hidden" name="line_item_id" value="{{ item.id }}"></td>
                </tr>
            {% endfor %}
            <!-- Empty row for new entries -->
            <tr>
                <td><input type="text" name="description"></td>
                <td><input type="number" name="quantity"></td>
                <td><input type="number" name="unit_price"></td>
                <td><input type="text" name="total_price" readonly></td>
                <td><input type="hidden" name="line_item_id" value=""></td>
            </tr>
        </tbody>
    </table>

    <button type="submit">Save Changes</button>
</form>

{% endblock %}
