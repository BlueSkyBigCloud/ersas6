{% extends "base2.html" %}
{% block content %}
<h1>Edit Prospect: {{ prospect.name }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'prospect_profile' prospect.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
