{% extends 'base2.html' %}  <!-- Extend the base template -->

{% block title %}Service Request Note{% endblock %}  <!-- Title for the page -->

{% block content %}
<h1>Opportunities</h1>

<!-- Map container -->
<div id="map" style="width: 100%; height: 500px; border: 1px solid #ccc;"></div>

<!-- Results container -->
<div id="results" class="mt-4">
  <h2 id="results-title">Select a state to view average prices</h2>
  <ul id="price-list"></ul>
</div>

<!-- Leaflet CSS & JS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const priceDataUrl = "{% url 'priceanalysis:price_data' %}";

  // Initialize Leaflet map
  const map = L.map("map").setView([37.8, -96], 4);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  // Fetch US states GeoJSON (public domain file)
  fetch("https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json")
    .then(res => res.json())
    .then(statesData => {
      L.geoJson(statesData, {
        style: {
          color: "#333",
          weight: 1,
          fillColor: "#d9edf7",
          fillOpacity: 0.6
        },
        onEachFeature: function(feature, layer) {
          layer.on({
            click: function() {
              const stateAbbr = feature.properties.postal; // two-letter code
              loadPrices(stateAbbr);
            }
          });
        }
      }).addTo(map);
    });

  function loadPrices(stateCode) {
    fetch(`${priceDataUrl}?state=${stateCode}`)
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("price-list");
        const title = document.getElementById("results-title");

        if (data.error) {
          title.textContent = data.error;
          list.innerHTML = "";
          return;
        }

        title.textContent = `Average Prices in ${stateCode}`;
        list.innerHTML = "";

        if (data.data.length === 0) {
          list.innerHTML = "<li>No data available</li>";
          return;
        }

        data.data.forEach(item => {
          const li = document.createElement("li");
          li.textContent = `${item.service_type}: $${item.avg_price.toFixed(2)}`;
          list.appendChild(li);
        });
      })
      .catch(err => {
        console.error("Error fetching price data:", err);
      });
  }
</script>
{% endblock %}
