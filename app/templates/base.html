{% load static %}  <!-- Load the static template tag library -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}"> <!-- Update the path to your favicon file -->
    <title>{% block title %}PROFOROPS -test{% endblock %}</title>  <!-- Default title -->
    <style>
                            
        .home-button {
            font-family: Arial, sans-serif;
            font-size: 1.0em;        /* Slightly larger font for emphasis */
            color: #ffffff;          /* White text color */
            background-color: #020000; /* Professional blue background */
            padding: 10px 20px;      /* Padding for a button-like appearance */
            border-radius: 5px;      /* Rounded corners */
            text-decoration: none;   /* Remove underline */
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); /* Soft shadow */
            transition: background-color 0.3s ease; /* Smooth hover transition */
            width: 100%;
        }

        .home-button:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
        .dashboard-footer {
            text-align: center;
            padding: 09px;
            background-color: #90bdec;
            color: #dde8eb;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

        .dashboard-footer p {
            margin: 0;
        }
        .centered-div {
            display: flex;                     /* Use flexbox for centering */
            justify-content: center;           /* Center horizontally */
            align-items: center;               /* Center vertically */
            height: 4vh;                       /* Full viewport height */          /* Black background color */                    /* Allow the button to take full width of its container */
            width: auto;                       /* Automatic width */
            margin: 0 auto;                   /* Center the div horizontally */
            padding: 1rem;                    /* Padding inside the div */
            border-radius: 8px;               /* Rounded corners */
        }

        /* Signup Button Styles */
        .signup-button {
            color: white;                      /* White text color for contrast */
            text-decoration: none;             /* Remove underline from link */
            font-size: 0.5em;                  /* Adjust font size as needed */
            padding: 10px 15px;               /* Padding for the button */
            background-color: #022f5e;        /* Button background color */
            border: none;                     /* Remove border */
            border-radius: 5px;               /* Rounded corners */
            cursor: pointer;                   /* Pointer cursor on hover */
            transition: background-color 0.3s ease; /* Smooth transition for hover effect */
            width: 100%;
        }

        .signup-button:hover {
            background-color: #000000;        /* Darker blue on hover */
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1rem;
        }

        .nav-links li a {
            text-decoration: none;
            color: #000;
        }

        /* Hide toggle on desktop */
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .nav-links {
                display: block;
                flex-direction: column;
                background: #fff;
                position: absolute;
                top: 70px;  /* adjust depending on header height */
                left: 0;
                width: 100%;
                padding: 1rem 0;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }

            .nav-links.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }
        }

    </style>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">  <!-- Link to CSS -->
</head>
<body>
    <header>
        <style>
        </style>
        <h1><a href="{% url 'home' %}" class="home-button">PROFOROPS</a></h1>
        <img src="{% static 'images/PROFOROPS_LOGO.jpg' %}" alt="PROFOROPS Logo" class="mobile-logo">
        <nav>
            <ul>
                <P></P>
                <li><a href="{% url 'equipmentstore' %}">Equipment Store</a></li>
                <li><a href="{% url 'digitalsolutions' %}">Digital Solutions</a></li>
                <!-- Add more links here as needed -->
            </ul>
        </nav>
        <div class="login-container">
            <a class="login-button" href="{% url 'login' %}">Login</a>
        </div>
    </header>
    <main>
        {% block content %}
        <!-- Default content can be placed here -->
        {% endblock %}
    </main>
    <footer class="dashboard-footer">
        <p>&copy; 2026 PROFOROPS</p>
    </footer>
</body>
</html>
