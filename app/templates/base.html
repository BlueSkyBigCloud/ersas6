{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PROFOROPS{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#fff;
            color:#222;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

                /* =========================
        HEADER
        ========================= */

        header{
            background:#fff;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
            position:sticky;
            top:0;
            z-index:1000;
        }

        .navbar{
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:12px 20px;
            position:relative;
        }

        .left-nav{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .home-button{
            display:inline-block;
            background:#020000;
            color:#fff;
            text-decoration:none;
            padding:12px 18px;
            border-radius:5px;
            font-weight:bold;
            white-space:nowrap;
        }

        .home-button:hover{
            background:#0056b3;
        }

        .mobile-logo{
            width:70px;
            height:auto;
        }

        nav{
            margin-left:auto;
        }

        .nav-links{
            display:flex;
            list-style:none;
            gap:25px;
            align-items:center;
        }

        .nav-links a{
            text-decoration:none;
            color:#111;
            font-weight:bold;
        }

        .login-button{
            background:#022f5e;
            color:#fff !important;
            padding:10px 18px;
            border-radius:5px;
        }

        .menu-toggle{
            display:none;
            background:none;
            border:none;
            font-size:30px;
            cursor:pointer;
            padding:0 6px;
        }

        /* ---------- MOBILE ---------- */

        @media (max-width:768px){

            .navbar{
                justify-content:flex-start;
                gap:10px;
            }

            .left-nav{
                display:flex;
                align-items:center;
                gap:6px;
                flex:1;
            }

            .home-button{
                margin-left:0;
                padding:10px 14px;
                font-size:.95rem;
            }

            .menu-toggle{
                display:block;
            }

            .mobile-logo{
                width:55px;
                margin-left:auto;
            }

            nav{
                width:100%;
                margin-left:0;
            }

            .nav-links{
                display:none;
                position:absolute;
                top:100%;
                left:0;
                width:100%;
                background:#fff;
                flex-direction:column;
                gap:0;
                box-shadow:0 3px 10px rgba(0,0,0,.15);
            }

            .nav-links.active{
                display:flex;
            }

            .nav-links li{
                width:100%;
                border-bottom:1px solid #eee;
            }

            .nav-links a{
                display:block;
                padding:15px;
                text-align:center;
            }
        }

            .logo-section{
                flex:1;
            }

            .mobile-logo{
                width:55px;
            }

            .home-button{
                font-size:0.95rem;
                padding:10px 15px;
            }
        
    </style>
</head>

<body>

<header>

    <div class="navbar">

        <div class="left-nav">

            <a href="{% url 'home' %}" class="home-button">
                PROFOROPS
            </a>

            <button class="menu-toggle" onclick="toggleMenu()">
                &#9776;
            </button>

        </div>

        <img
            src="{% static 'images/PROFOROPS_LOGO.jpg' %}"
            alt="PROFOROPS Logo"
            class="mobile-logo">

        <nav>

            <ul class="nav-links" id="navLinks">

                <li>
                    <a href="{% url 'equipmentstore' %}">
                        Equipment Store
                    </a>
                </li>

                <li>
                    <a href="{% url 'digitalsolutions' %}">
                        Digital Solutions
                    </a>
                </li>

                <li>
                    <a href="{% url 'login' %}" class="login-button">
                        Login
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>

<main>

    {% block content %}
    {% endblock %}

</main>

<footer class="dashboard-footer">
    <p>&copy; 2026 PROFOROPS</p>
</footer>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}

// Close menu when a link is clicked (mobile)
document.querySelectorAll("#navLinks a").forEach(link => {
    link.addEventListener("click", function () {
        document.getElementById("navLinks").classList.remove("active");
    });
});
</script>

</body>
</html>
