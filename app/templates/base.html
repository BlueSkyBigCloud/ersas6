{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PROFOROPS{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#fff;
            color:#222;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        /* =========================
           HEADER
        ========================== */

        header{
            background:#ffffff;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
            position:sticky;
            top:0;
            z-index:1000;
        }

        .navbar{
            max-width:1200px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 20px;
            position:relative;
        }

        .logo-section{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .home-button{
            display:inline-block;
            background:#020000;
            color:#fff;
            text-decoration:none;
            padding:12px 20px;
            border-radius:6px;
            font-size:1.1rem;
            font-weight:bold;
            transition:.3s;
        }

        .home-button:hover{
            background:#0056b3;
        }

        .mobile-logo{
            width:70px;
            height:auto;
            border-radius:6px;
        }

        nav{
            margin-left:auto;
        }

        .nav-links{
            list-style:none;
            display:flex;
            align-items:center;
            gap:25px;
        }

        .nav-links a{
            text-decoration:none;
            color:#111;
            font-weight:bold;
            transition:.3s;
        }

        .nav-links a:hover{
            color:#0056b3;
        }

        .login-button{
            background:#022f5e;
            color:white;
            padding:10px 18px;
            border-radius:5px;
        }

        .login-button:hover{
            background:black;
            color:white;
        }

        .menu-toggle{
            display:none;
            background:none;
            border:none;
            font-size:30px;
            cursor:pointer;
        }

        /* =========================
           MAIN CONTENT
        ========================== */

        main{
            flex:1;
            max-width:1200px;
            width:100%;
            margin:30px auto;
            padding:20px;
        }

        /* =========================
           FOOTER
        ========================== */

        .dashboard-footer{
            text-align:center;
            padding:12px;
            background:#90bdec;
            color:white;
            margin-top:auto;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width:768px){

            .navbar{
                flex-wrap:wrap;
            }

            .menu-toggle{
                display:block;
                margin-left:auto;
            }

            nav{
                width:100%;
            }

            .nav-links{
                display:none;
                flex-direction:column;
                width:100%;
                background:white;
                margin-top:15px;
                border-top:1px solid #ddd;
                box-shadow:0 4px 10px rgba(0,0,0,.1);
            }

            .nav-links.active{
                display:flex;
            }

            .nav-links li{
                width:100%;
                text-align:center;
                border-bottom:1px solid #eee;
            }

            .nav-links li:last-child{
                border-bottom:none;
            }

            .nav-links a{
                display:block;
                padding:15px;
            }

            .logo-section{
                flex:1;
            }

            .mobile-logo{
                width:55px;
            }

            .home-button{
                font-size:0.95rem;
                padding:10px 15px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="navbar">

        <div class="logo-section">
            <a href="{% url 'home' %}" class="home-button">
                PROFOROPS
            </a>

            <img
                src="{% static 'images/PROFOROPS_LOGO.jpg' %}"
                alt="PROFOROPS Logo"
                class="mobile-logo">
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">
            ☰
        </button>

        <nav>

            <ul class="nav-links" id="navLinks">

                <li>
                    <a href="{% url 'equipmentstore' %}">
                        Equipment Store
                    </a>
                </li>

                <li>
                    <a href="{% url 'digitalsolutions' %}">
                        Digital Solutions
                    </a>
                </li>

                <li>
                    <a href="{% url 'login' %}" class="login-button">
                        Login
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>

<main>

    {% block content %}
    {% endblock %}

</main>

<footer class="dashboard-footer">
    <p>&copy; 2026 PROFOROPS</p>
</footer>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}

// Close menu when a link is clicked (mobile)
document.querySelectorAll("#navLinks a").forEach(link => {
    link.addEventListener("click", function () {
        document.getElementById("navLinks").classList.remove("active");
    });
});
</script>

</body>
</html>
